services:
  - type: web
    name: handwritten-physics-feedback
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: VITE_STUDY_MODE
        value: "false"
      - key: VITE_STUDY_INCLUDE_TRANSCRIPTION
        value: "false"
